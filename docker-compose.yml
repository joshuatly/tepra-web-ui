# Portainer: Stacks → Add stack → Repository (this repo, compose path docker-compose.yml)
# or paste this file into the Web editor.
services:
  tepra-web:
    build: .
    image: tepra-web:latest
    container_name: tepra-web
    restart: unless-stopped
    # Host networking lets "Find on network" broadcast to the printer and avoids
    # any NAT between the container and the printer's UDP 9100 replies.
    # The UI is then on http://<docker-host>:8765/ (change PORT below if 8765 is taken).
    network_mode: host
    environment:
      PORT: "8765"
      # Optional: pre-configure printers (comma separated, "Name=IP[:port][@model]")
      # TEPRA_PRINTERS: "Label printer=192.168.1.50"
      TZ: "UTC"
    volumes:
      - tepra-data:/data
    # Polls the app's /healthz endpoint; Portainer and `docker ps` show the
    # container as healthy/unhealthy. Uses $PORT so it follows the setting above.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:$${PORT}/healthz\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Docker itself never restarts an *unhealthy* container (restart: only reacts
    # to the process exiting). This label lets the optional autoheal service
    # below restart it automatically.
    labels:
      autoheal: "true"

    # --- Without host networking (e.g. Docker Desktop), use this instead: ---
    # network_mode: bridge
    # ports:
    #   - "8765:8765"
    # Discovery will not work in bridge mode; enter the printer IP manually.

  # Optional: restart tepra-web when its health check fails. Needs the Docker socket.
  # autoheal:
  #   image: willfarrell/autoheal:latest
  #   container_name: autoheal
  #   restart: unless-stopped
  #   environment:
  #     AUTOHEAL_CONTAINER_LABEL: autoheal
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

volumes:
  tepra-data:
